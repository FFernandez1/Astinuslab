# Alembic configuration for the AstinusLab SQLite database.
#
# Normal operation never needs this file directly: src/astinuslab/db.py invokes
# Alembic programmatically (initialize_database / python -m astinuslab.dbcli init).
# It exists so the alembic CLI also works for development, e.g. from the repo
# root:
#
#   .venv/bin/alembic -c src/astinuslab/migrations/alembic.ini revision -m "describe change"
#   .venv/bin/alembic -c src/astinuslab/migrations/alembic.ini upgrade head
#
# The database URL is not configured here; env.py uses the application engine
# (astinuslab.db.engine), which honours ASTINUSLAB_DB_PATH / astinuslab.toml.

[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os
