site_name: AstinusLab
site_description: Attack-and-forensics playground for local security research labs
# No site_url: there is no public documentation site for 1.0.0, and the previous
# value was a placeholder domain the project does not own. site_url drives
# canonical links and the sitemap, so shipping the placeholder meant publishing
# canonical URLs pointing somewhere we do not control.
#
# Known cost of omitting it: no canonical tags are emitted (correct), but
# sitemap.xml entries come out as "None./", "NoneLICENSE/", ... The
# mkdocs-static-i18n sitemap template falls back to `config.site_url ~ file.url`
# with no None-guard, and Jinja renders None as the string "None". Harmless for
# local/preview builds, where nothing reads sitemap.xml.
#
# Set this to the real URL before publishing the site. That fixes both the
# canonical tags and the sitemap; no other change is needed.
docs_dir: .
site_dir: ../site
exclude_docs: |
  plans/**
  superpowers/**
  audits/**
  remediation/**

not_in_nav: |
  development/verification-matrix.md
  development/RELEASE_ACCEPTANCE.md
  development/portable-package-evidence.md
  benchmarks/workflows.md
  benchmarks/2026-09-07-small-workflows.md
  reference/API.md
  reference/PLAYGROUND_API.md
  reference/API.es.md
  reference/PLAYGROUND_API.es.md
  reference/API.fr.md
  reference/PLAYGROUND_API.fr.md
  reference/API.ca.md
  reference/PLAYGROUND_API.ca.md
  architecture/repository-inventory.md
  architecture/repository-boundaries.md
  architecture/repository-placement-policy.md
  architecture/repository-target-layout.md
  architecture/path-migration-matrix.md
  dev/host-nightly-runner.md
  dev/upgrade-acceptance-host.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Fira Mono
    code: Fira Mono
  features:
    - search.suggest
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/toc-active-hash.js
  - javascripts/navigation.js

hooks:
  - hooks/strip_i18n_alternate_links.py
  - hooks/split_search_index_by_language.py

plugins:
