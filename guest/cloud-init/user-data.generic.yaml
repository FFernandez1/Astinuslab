#cloud-config
preserve_hostname: false

users:
  - default
  - name: REPLACE_GUEST_USER
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, adm
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE_WITH_LAB_PUBLIC_KEY

ssh_pwauth: false
disable_root: true

growpart:
  mode: auto
  devices: ["/"]
  ignore_growroot_disabled: false

resize_rootfs: true

package_update: true

packages:
  - qemu-guest-agent

runcmd:
  - systemctl start qemu-guest-agent || /usr/sbin/qemu-ga -d

