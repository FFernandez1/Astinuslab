name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first; the maintainer reviews requests on demand and best effort.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playground
        - Jobs
        - Workloads
        - Attacker VMs
        - Memory or disk capture
        - Volatility 3 analysis
        - Installer, upgrade or uninstall
        - Web UI
        - Documentation
        - Other
