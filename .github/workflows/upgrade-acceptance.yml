name: Upgrade acceptance (disposable host)

# The install/upgrade/rollback matrix, run for real.
#
# This is the only workflow in the repository that installs AstinusLab
# system-wide as root. Across fourteen rows it creates service identities,
# writes and removes systemd units, moves ACLs and MAC policy, forces a failed
# migration and a failed service start, performs a split-identity migration and
# rollback, and uninstalls twice -- once preserving data and once deleting it.
#
# So it is deliberately NOT on a schedule and deliberately NOT on the
# `[self-hosted, libvirt]` runner that host-nightly.yml uses. That runner is
# provisioned by hand and long-lived: the operator installs Volatility 3 into
# its own path there, and this matrix would rewrite the machine underneath it.
#
# Requirements for whatever host carries the `disposable` label:
#   * it is rebuilt or snapshot-restored between runs, and nothing else depends
#     on its state;
#   * it has live systemd, passwordless sudo for the runner user, and the
#     installer's host prerequisites;
#   * it carries the marker file named below, placed by hand.
#
# The label alone is not the safety mechanism -- a label can be attached to the
# wrong machine by mistake. The marker file is a second, host-local statement
# that this machine is expendable, and the run refuses without it.

on:
  workflow_dispatch:
    inputs:
      prior_ref:
        description: "Git ref of the genuine prior version to upgrade FROM (tag, branch or full SHA)"
        required: true
      acknowledge_destructive:
        description: "Type DESTROY-THIS-HOST to confirm the target is disposable"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  # Two of these on one host would interleave installs of different commits
  # into the same /opt/astinuslab and report nonsense.
  group: upgrade-acceptance
  cancel-in-progress: false

jobs:
  upgrade-matrix:
    name: Install, upgrade and rollback matrix
    runs-on: [self-hosted, disposable]
    # Row 0 alone installs a prior version, upgrades, and uninstalls; the full
    # matrix does that thirteen more times with induced failures in between.
    timeout-minutes: 180
    env:
      INSTALL_DIR: /opt/astinuslab
      CUSTOM_ROOT: /srv/astinuslab-acceptance/storage
      DISPOSABLE_MARKER: /etc/astinuslab-disposable-host

    steps:
      - name: Refuse to run without an explicit acknowledgement
        # Dispatch inputs reach the shell through the environment, never through
        # `${{ }}` interpolation into a command: interpolation splices the raw
        # string into the script before bash sees it, so a crafted value would
        # run as code here rather than be compared as data.
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledge_destructive }}
        run: |
          set -euo pipefail
          if [ "$ACKNOWLEDGEMENT" != "DESTROY-THIS-HOST" ]; then
            echo "::error::This workflow reinstalls and uninstalls AstinusLab system-wide as root."
            echo "::error::Re-run it with acknowledge_destructive set to DESTROY-THIS-HOST."
            exit 1
          fi

      - name: Refuse to run on a host that has not declared itself disposable
        run: |
          set -euo pipefail
          if [ ! -f "$DISPOSABLE_MARKER" ]; then
            echo "::error::$DISPOSABLE_MARKER is absent, so this host has not been declared disposable."
            echo "::error::The matrix installs to $INSTALL_DIR, rewrites systemd units, ACLs and MAC"
            echo "::error::policy, and uninstalls twice. Run it only on a host you can throw away."
            echo "::error::To accept that, on the runner: sudo touch $DISPOSABLE_MARKER"
            exit 1
          fi
          echo "Marker present; treating $(hostname) as disposable."

      - name: Check out the candidate with full history
        uses: actions/checkout@v4
        with:
          # The prior ref has to be resolvable locally to build its archive.
          fetch-depth: 0

      - name: Resolve both commits
        id: commits
        env:
          PRIOR_REF: ${{ inputs.prior_ref }}
        run: |
          set -euo pipefail
          # Refuse anything that is not plausibly a ref before it reaches git.
          # `git rev-parse` is safe with the value in a variable, but a narrow
          # character set keeps option-looking and path-looking inputs out too.
          if ! printf '%s' "$PRIOR_REF" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "::error::prior_ref must be a plain tag, branch or SHA."
            exit 1
          fi
          candidate="$(git rev-parse HEAD)"
          if ! prior="$(git rev-parse --verify "${PRIOR_REF}^{commit}" 2>/dev/null)"; then
            echo "::error::prior_ref does not resolve to a commit in this checkout."
            exit 1
          fi
          if [ "$candidate" = "$prior" ]; then
            echo "::error::prior_ref resolves to the candidate commit; an upgrade needs two different commits."
            exit 1
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "prior=$prior" >> "$GITHUB_OUTPUT"
          echo "Candidate $candidate, prior $prior"

      - name: Build the two source archives
        id: archives
        env:
          CANDIDATE_SHA: ${{ steps.commits.outputs.candidate }}
          PRIOR_SHA: ${{ steps.commits.outputs.prior }}
        run: |
          set -euo pipefail
          work="$(mktemp -d /tmp/astinuslab-acceptance.XXXXXXXX)"
          # The matrix verifies each tree against its archive and its commit, so
          # these must be genuine `git archive` output, not a copied worktree.
          git archive --format=tar --output="$work/candidate.tar" "$CANDIDATE_SHA"
          git archive --format=tar --output="$work/prior.tar" "$PRIOR_SHA"
          mkdir -p "$work/candidate" "$work/prior"
          tar -xf "$work/candidate.tar" -C "$work/candidate"
          tar -xf "$work/prior.tar" -C "$work/prior"
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Run the matrix
        id: matrix
        env:
          WORK: ${{ steps.archives.outputs.work }}
          CANDIDATE_COMMIT: ${{ steps.commits.outputs.candidate }}
          PRIOR_COMMIT: ${{ steps.commits.outputs.prior }}
        run: |
          set -uo pipefail
          work="$WORK"
          mkdir -p "$RUNNER_TEMP/acceptance"
          # Every row runs even after an earlier one fails, so the exit code is
          # captured rather than allowed to abort the job: the report below is
          # the deliverable, not the first stop.
          SRC="$work/candidate" \
          PRIOR_SRC="$work/prior" \
          CANDIDATE_ARCHIVE="$work/candidate.tar" \
          PRIOR_ARCHIVE="$work/prior.tar" \
          CANDIDATE_SHA="$CANDIDATE_COMMIT" \
          PRIOR_SHA="$PRIOR_COMMIT" \
          INSTALL_DIR="$INSTALL_DIR" \
          CUSTOM_ROOT="$CUSTOM_ROOT" \
            "$work/candidate/tests/shell/host/upgrade_matrix.sh" \
            2>&1 | tee "$RUNNER_TEMP/acceptance/upgrade-matrix.log"
          status="${PIPESTATUS[0]}"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -3 "$RUNNER_TEMP/acceptance/upgrade-matrix.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Collect the row logs
        if: always()
        run: |
          set -uo pipefail
          dest="$RUNNER_TEMP/acceptance"
          mkdir -p "$dest"
          # Per-row logs the matrix writes as it goes. Best effort: a row that
          # never ran leaves none, and that is not itself a failure.
          for log in /tmp/r*.log /tmp/astinuslab-matrix-*.log; do
            [ -f "$log" ] && cp -- "$log" "$dest/" || true
          done
          ls -la "$dest" || true

      - name: Upload the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-acceptance-${{ steps.commits.outputs.candidate }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 30

      - name: Remove the extracted archives
        if: always()
        env:
          WORK: ${{ steps.archives.outputs.work }}
        run: |
          set -uo pipefail
          work="$WORK"
          # The matrix asserts both source trees stayed byte-identical, so this
          # only runs once it has finished reading them.
          [ -n "${work:-}" ] && rm -rf -- "$work" || true
